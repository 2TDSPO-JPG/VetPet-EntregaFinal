spring.application.name=vetpet-api
spring.config.import=optional:file:./local.properties
server.port=${PORT:8080}
server.servlet.session.timeout=60m
server.error.include-message=always

spring.datasource.url=jdbc:h2:file:./data/vetpet;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:0}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://vetpet:vetpet@localhost:5672}
spring.rabbitmq.listener.simple.auto-startup=${vetpet.mensageria.habilitada}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.paths-to-match=/api/**

vetpet.admin.email=${VETPET_ADMIN_EMAIL:admin@vetpet.com}
vetpet.admin.senha=${VETPET_ADMIN_SENHA:admin123}
vetpet.mensageria.habilitada=${MENSAGERIA_HABILITADA:true}
vetpet.mensageria.exchange=vetpet.events
vetpet.mensageria.fila-historico=vetpet.historico
vetpet.notificacao.url=${NOTIFICACAO_URL:http://localhost:8081}
vetpet.notificacao.api-key=${NOTIFICACAO_API_KEY:vetpet-dev-key}
vetpet.cors.origens=${CORS_ORIGENS:*}
vetpet.lembretes.cron=${LEMBRETES_CRON:0 */30 * * * *}
vetpet.seed.habilitado=${SEED_HABILITADO:true}
