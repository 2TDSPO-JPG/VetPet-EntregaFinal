<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabeca(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | VetPet'">VetPet</title>
    <link rel="icon" th:href="@{/favicon/faviconVetPet.jpg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>

<th:block th:fragment="pagina(menu, conteudo)">
    <div class="topo-mobile">
        <a class="marca" th:href="@{/dashboard}">
            <img th:src="@{/favicon/faviconVetPet.jpg}" alt="">
            Vet<span>Pet</span>
        </a>
        <button type="button" data-menu-toggle aria-expanded="false" aria-label="Abrir menu">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </div>
    <div class="app">
        <aside class="lateral" aria-label="Navegação principal">
            <a class="marca" th:href="@{/dashboard}">
                <img th:src="@{/favicon/faviconVetPet.jpg}" alt="">
                Vet<span>Pet</span>
            </a>
            <nav class="menu">
                <a th:href="@{/dashboard}" th:classappend="${menu == 'painel'} ? 'ativo'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
                    Painel
                </a>
                <span class="menu-grupo">Cuidado</span>
                <a th:href="@{/pets}" th:classappend="${menu == 'pets'} ? 'ativo'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="10" r="2"/><circle cx="9.5" cy="5.5" r="2"/><circle cx="14.5" cy="5.5" r="2"/><circle cx="18.5" cy="10" r="2"/><path d="M12 12c-3 0-6 4.5-6 7 0 1.5 1.5 2 3 2 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.5 0 3-.5 3-2 0-2.5-3-7-6-7z"/></svg>
                    Pets
                </a>
                <a th:href="@{/atendimentos}" th:classappend="${menu == 'atendimentos'} ? 'ativo'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
                    Atendimentos
                </a>
                <a th:href="@{/prontuarios}" th:classappend="${menu == 'prontuarios'} ? 'ativo'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 12v6M9 15h6"/></svg>
                    Prontuários
                </a>
                <span class="menu-grupo">Pessoas</span>
                <a th:href="@{/tutores}" th:classappend="${menu == 'tutores'} ? 'ativo'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-1.5-5-4-5.6"/></svg>
                    Tutores
                </a>
                <a th:href="@{/veterinarios}" th:classappend="${menu == 'veterinarios'} ? 'ativo'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a6 6 0 0 0 12 0V3"/><path d="M12 15v2a4 4 0 0 0 8 0v-3"/><circle cx="20" cy="12" r="2"/></svg>
                    Veterinários
                </a>
                <span class="menu-grupo">Mensageria</span>
                <a th:href="@{/notificacoes}" th:classappend="${menu == 'notificacoes'} ? 'ativo'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                    Notificações
                </a>
                <a th:href="@{/swagger-ui.html}" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
                    Documentação da API
                </a>
            </nav>
            <div class="lateral-rodape" th:if="${usuario != null}">
                <div class="usuario">
                    <span class="avatar" th:text="${usuario.iniciais}">AR</span>
                    <div>
                        <strong th:text="${usuario.nome}">Ana Ribeiro</strong>
                        <small th:text="${usuario.admin} ? 'Administrador' : 'Veterinário(a)'">Veterinário(a)</small>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="botao botao-secundario botao-pequeno" style="width:100%">Sair</button>
                </form>
            </div>
        </aside>
        <div class="conteudo" id="conteudo">
            <div class="alerta alerta-sucesso" role="status" th:if="${sucesso != null}">
                <span th:text="${sucesso}">Operação realizada.</span>
                <button type="button" data-fechar-alerta aria-label="Fechar">&times;</button>
            </div>
            <div class="alerta alerta-erro" role="alert" th:if="${erro != null}">
                <span th:text="${erro}">Algo deu errado.</span>
                <button type="button" data-fechar-alerta aria-label="Fechar">&times;</button>
            </div>
            <th:block th:replace="${conteudo}"></th:block>
        </div>
    </div>
</th:block>

<th:block th:fragment="paginacao(pagina, link)">
    <div class="paginacao" th:if="${pagina.totalElements > 0}">
        <span th:text="|Mostrando ${pagina.numberOfElements} de ${pagina.totalElements} registro(s)|">Mostrando 10 de 42</span>
        <nav aria-label="Paginação" th:if="${pagina.totalPages > 1}">
            <a th:unless="${pagina.first}" th:href="@{${link}(pagina=${pagina.number - 1})}" aria-label="Página anterior">&lsaquo;</a>
            <th:block th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}">
                <span class="atual" th:if="${i == pagina.number}" th:text="${i + 1}" aria-current="page">1</span>
                <a th:unless="${i == pagina.number}" th:href="@{${link}(pagina=${i})}" th:text="${i + 1}">2</a>
            </th:block>
            <a th:unless="${pagina.last}" th:href="@{${link}(pagina=${pagina.number + 1})}" aria-label="Próxima página">&rsaquo;</a>
        </nav>
    </div>
</th:block>

<div th:fragment="entrada(nome, rotulo, tipo, largura)" class="campo"
     th:classappend="${largura + (#fields.hasErrors(nome) ? ' campo-erro' : '')}">
    <label th:for="${nome}" th:text="${rotulo}">Rótulo</label>
    <input th:type="${tipo}" th:field="*{__${nome}__}">
    <span class="erro-campo" th:if="${#fields.hasErrors(nome)}" th:errors="*{__${nome}__}">Erro</span>
</div>

<div th:fragment="texto(nome, rotulo, largura)" class="campo"
     th:classappend="${largura + (#fields.hasErrors(nome) ? ' campo-erro' : '')}">
    <label th:for="${nome}" th:text="${rotulo}">Rótulo</label>
    <textarea th:field="*{__${nome}__}" rows="4"></textarea>
    <span class="erro-campo" th:if="${#fields.hasErrors(nome)}" th:errors="*{__${nome}__}">Erro</span>
</div>

<th:block th:fragment="erroCampo(campo)">
    <span class="erro-campo" th:if="${#fields.hasErrors(campo)}" th:errors="*{__${campo}__}">Erro</span>
</th:block>

<th:block th:fragment="errosGlobais">
    <div class="alerta alerta-erro" role="alert" th:if="${#fields.hasGlobalErrors()}">
        <span th:each="mensagem : ${#fields.globalErrors()}" th:text="${mensagem}">Erro</span>
    </div>
</th:block>

</body>
</html>
