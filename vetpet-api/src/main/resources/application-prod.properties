spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:0}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.thymeleaf.cache=true

vetpet.admin.email=${VETPET_ADMIN_EMAIL}
vetpet.admin.senha=${VETPET_ADMIN_SENHA}
vetpet.seed.habilitado=${SEED_HABILITADO:false}
