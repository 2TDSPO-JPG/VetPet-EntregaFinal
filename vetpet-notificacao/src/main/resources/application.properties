spring.application.name=vetpet-notificacao
spring.config.import=optional:file:./local.properties
server.port=${PORT:8081}

spring.datasource.url=${NOTIFICACAO_DB_URL:jdbc:h2:mem:notificacoes;DB_CLOSE_DELAY=-1}
spring.datasource.username=${NOTIFICACAO_DB_USERNAME:sa}
spring.datasource.password=${NOTIFICACAO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://vetpet:vetpet@localhost:5672}
spring.rabbitmq.listener.simple.auto-startup=${MENSAGERIA_HABILITADA:true}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false
management.health.mail.enabled=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

notificacao.api-key=${NOTIFICACAO_API_KEY:vetpet-dev-key}
notificacao.exchange=vetpet.events
notificacao.fila=vetpet.notificacoes
notificacao.email.remetente=${MAIL_FROM:${MAIL_USERNAME:}}
notificacao.email.dominios-ignorados=example.com
